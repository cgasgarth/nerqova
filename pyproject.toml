[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nerqova"
version = "0.1.0"
description = "Optimized MLX decision inference on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/mlx_lm_LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "kev",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1"]

[tool.uv.sources]
kev = { git = "https://github.com/jaredpalmer/kev.git", rev = "557598fced1dada75dfbf36ed144dce309ac6ceb" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads model weights and requires Apple Silicon"]
